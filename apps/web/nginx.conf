server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # MJPEG is an endless response. Nginx's default response buffering keeps
  # completed chunks in its proxy buffer, which leaves an <img> blank while
  # the avatar is speaking. Pass each JPEG boundary through immediately.
  location /api/live-media/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    proxy_read_timeout 180s;
    add_header X-Accel-Buffering no always;
  }

  # Binary realtime transport. The browser receives 16 kHz PCM and JPEG
  # frames carrying the same 25-fps PTS directly from the private GPU worker.
  location /avatar-stream/ {
    proxy_pass http://avatar-worker:8010/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 180s;
    proxy_buffering off;
  }

  location /ws/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
