# Docker can reuse a recreated worker's old IP for another renderer. Resolve
# service names continuously instead of pinning them at nginx startup.
# Open-source dynamic upstream resolution requires nginx >= 1.27.3.
resolver 127.0.0.11 valid=1s ipv6=off;
upstream api_backend {
  zone api_backend 64k;
  server api:8000 resolve;
}
upstream avatar_default {
  zone avatar_default 64k;
  server avatar-worker:8010 resolve;
}
upstream avatar_realtime {
  zone avatar_realtime 64k;
  server avatar-worker-realtime:8010 resolve;
}
upstream avatar_trt10 {
  zone avatar_trt10 64k;
  server avatar-worker-trt10:8010 resolve;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # MJPEG is an endless response. Nginx's default response buffering keeps
  # completed chunks in its proxy buffer, which leaves an <img> blank while
  # the avatar is speaking. Pass each JPEG boundary through immediately.
  location /api/live-media/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    proxy_read_timeout 180s;
    add_header X-Accel-Buffering no always;
  }

  # Binary realtime transport. The browser receives 16 kHz PCM and JPEG
  # frames carrying the same 25-fps PTS directly from the private GPU worker.
  location /avatar-stream/ {
    proxy_pass http://avatar_default/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 180s;
    proxy_buffering off;
  }

  # Realtime has an independent Ditto GPU process. Keep its socket isolated
  # from Ditto Default so an experiment cannot stall the stable baseline.
  location /avatar-stream-realtime/ {
    proxy_pass http://avatar_realtime/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 180s;
    proxy_buffering off;
  }

  # TensorRT 10 has its own isolated Ditto worker.  Without this explicit
  # WebSocket proxy, the SPA fallback returns index.html with HTTP 200, which
  # looks superficially successful but delivers no audio/video packets.
  location /avatar-stream-trt10/ {
    proxy_pass http://avatar_trt10/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 180s;
    proxy_buffering off;
  }

  location /ws/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
